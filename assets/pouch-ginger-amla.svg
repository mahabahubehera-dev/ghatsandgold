<svg viewBox="0 0 700 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE9D4"/>
      <stop offset="100%" stop-color="#E1E0BE"/>
    </linearGradient>
    <linearGradient id="stripeGinger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C9A46"/>
      <stop offset="100%" stop-color="#B4772B"/>
    </linearGradient>
    <linearGradient id="pouchShade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE4CC"/>
      <stop offset="55%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#E9DCC0"/>
    </linearGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2b3a10" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="700" height="1000" fill="url(#bgGlow2)"/>
  <ellipse cx="350" cy="900" rx="230" ry="34" fill="#2b3a10" opacity="0.13"/>

  <!-- pouch body -->
  <g filter="url(#soft2)">
    <path d="M170,150
             C170,110 190,90 230,86
             L470,86
             C510,90 530,110 530,150
             L536,830
             C536,868 512,890 470,892
             L230,892
             C188,890 164,868 164,830 Z"
          fill="url(#pouchShade2)" stroke="#DCCBA3" stroke-width="2"/>
    <path d="M232,90 C226,300 226,650 234,888" stroke="#DED0AE" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M468,90 C474,300 474,650 466,888" stroke="#DED0AE" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="182" y="118" width="336" height="34" rx="8" fill="#E3D3AC" opacity="0.8"/>
    <rect x="182" y="118" width="336" height="9" rx="4" fill="#D6C495"/>
  </g>

  <!-- accent stripe -->
  <path d="M232,88 C196,92 174,112 172,150 L166,828 C166,866 190,888 230,890 L266,890 L266,88 Z"
        fill="url(#stripeGinger)"/>

  <!-- veg mark -->
  <rect x="470" y="176" width="34" height="34" rx="4" fill="none" stroke="#23442B" stroke-width="2.5"/>
  <circle cx="487" cy="193" r="9" fill="#2D6A4F"/>

  <!-- emblem -->
  <g transform="translate(350,380)">
    <circle r="118" fill="#FFFDF7" stroke="#C89A2B" stroke-width="3"/>
    <circle r="104" fill="none" stroke="#C89A2B" stroke-width="1.4"/>
    <path id="arcTopGinger" d="M -96 8 A 96 96 0 0 1 96 8" fill="none"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#23442B" letter-spacing="1">
      <textPath href="#arcTopGinger" startOffset="50%" text-anchor="middle">GHATS &amp; GOLD</textPath>
    </text>
    <!-- ginger root shape -->
    <path d="M-46,26 C-58,10 -50,-10 -32,-14 C-24,-24 -6,-24 2,-14 C16,-20 32,-12 30,4 C42,8 44,26 30,32 C32,44 18,54 4,48 C-6,58 -24,54 -28,42 C-42,44 -50,34 -46,26 Z"
          fill="#C69A5B" stroke="#8A5A2B" stroke-width="2"/>
    <!-- amla fruit -->
    <circle cx="46" cy="14" r="16" fill="#8FAE5C" stroke="#5C7A3A" stroke-width="2"/>
    <path d="M46,-2 L46,-10 M40,-6 L52,-6" stroke="#5C7A3A" stroke-width="1.5"/>
    <circle cx="-52" cy="20" r="12" fill="#9BBE66" stroke="#5C7A3A" stroke-width="1.6" opacity="0.9"/>
  </g>

  <!-- product name -->
  <text x="350" y="612" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#23442B" letter-spacing="0.5">GINGER &amp; AMLA</text>
  <text x="350" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#5C5C5C">IMMUNITY BLEND</text>
  <text x="350" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" letter-spacing="2" fill="#9A7221">COLD DRIED &#183; STONE GROUND</text>
</svg>
